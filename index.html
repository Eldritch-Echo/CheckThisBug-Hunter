<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#122c30"><title>CheckThisBug - Hunter</title>
<link rel="manifest" href="./app.webmanifest"><link rel="icon" href="./icon-192.png"><link rel="stylesheet" href="./style.css">
<script defer src="./catalog.js"></script><script defer src="./app.js"></script></head>
<body><header><div class="bar"><div class="brand"><img src="./icon-192.png" alt="">CheckThisBug - Hunter</div>
<div class="tools"><select id="lang" aria-label="Idioma / Language"><option value="es">ES</option><option value="en">EN</option></select><button id="theme"></button></div></div></header>
<main><section class="hero"><div class="eyebrow" id="projectLabel"></div><button class="gear" id="settings">⚙</button><h1 id="projectName"></h1><div id="counts"></div><progress id="progress"></progress></section>
<h2 id="listTitle"></h2><div class="legend" id="legend"></div><div id="groups"></div><footer><button class="primary" id="pdf"></button><small id="footnote"></small></footer></main>
<dialog id="dialog"><form id="form"><h2 id="dialogTitle"></h2><label id="switchLabel" for="projects"></label><select id="projects"></select><label id="nameLabel" for="name"></label><input id="name" maxlength="100" required><div class="actions"><button type="button" id="cancel"></button><button class="primary" id="save"></button></div></form></dialog>
<article id="report"></article><p id="error" role="alert" hidden></p></body></html>
